<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <linearGradient id="envBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="50%" stop-color="#efe9dd"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="envShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ede6d8"/>
      <stop offset="100%" stop-color="#e3d9c8"/>
    </linearGradient>
    <linearGradient id="flapShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <linearGradient id="gussetL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.12)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <linearGradient id="gussetR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.12)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="textured"/>
      <feComponentTransfer in="textured">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.20)"/>
    </filter>
    <filter id="flapFilter">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
    <filter id="innerShadow">
      <feDropShadow dx="0" dy="-2" stdDeviation="4" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
    <clipPath id="envClip">
      <rect x="35" y="35" width="430" height="280" rx="4" ry="4"/>
    </clipPath>
  </defs>

  <!-- Drop shadow under envelope -->
  <rect x="38" y="42" width="430" height="280" rx="4" ry="4" fill="rgba(0,0,0,0.15)" filter="url(#dropShadow)"/>

  <!-- Envelope body -->
  <rect x="35" y="55" width="430" height="260" rx="4" ry="4" fill="url(#envBg)" filter="url(#paperTexture)"/>

  <!-- Envelope body subtle gradient overlay -->
  <rect x="35" y="55" width="430" height="260" rx="4" ry="4" fill="url(#envShadow)" opacity="0.5"/>

  <!-- Gusset left -->
  <rect x="35" y="55" width="20" height="260" fill="url(#gussetL)" rx="2"/>

  <!-- Gusset right -->
  <rect x="445" y="55" width="20" height="260" fill="url(#gussetR)" rx="2"/>

  <!-- Bottom shadow line -->
  <rect x="35" y="300" width="430" height="15" fill="rgba(0,0,0,0.06)" rx="2"/>

  <!-- Flap shadow on body -->
  <polygon points="35,55 250,175 465,55" fill="url(#flapShadow)" opacity="0.3"/>

  <!-- Flap -->
  <polygon points="35,55 250,170 465,55" fill="url(#flapGrad)" filter="url(#flapFilter)" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>

  <!-- Flap highlight -->
  <polygon points="60,58 250,155 440,58" fill="rgba(255,255,255,0.08)"/>

  <!-- Inner shadow at flap edge -->
  <line x1="35" y1="55" x2="465" y2="55" stroke="rgba(0,0,0,0.12)" stroke-width="1.5"/>

  <!-- Envelope border line -->
  <rect x="35" y="55" width="430" height="260" rx="4" ry="4" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>

  <!-- Stamp area outline (top right) -->
  <rect x="395" y="72" width="50" height="60" rx="2" ry="2" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Return address lines (top left) -->
  <line x1="52" y1="78" x2="120" y2="78" stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="90" x2="105" y2="90" stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="102" x2="110" y2="102" stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-linecap="round"/>
</svg>